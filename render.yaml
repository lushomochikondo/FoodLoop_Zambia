services:
  - type: web
    name: foodloop-zambia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-production.txt && python manage.py collectstatic --noinput
    startCommand: python scripts/render_start.py
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_TRUST_PROXY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: PRIVATE_UPLOADS_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "0"
